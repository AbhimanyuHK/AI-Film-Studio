name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      film_id:
        description: Immutable film identifier
        required: true
        type: string
      environment_id:
        description: Immutable production environment identifier
        required: true
        type: string
      aws_region:
        description: AWS region
        required: true
        default: ap-south-1
        type: string
      confirm:
        description: Type DEPLOY to authorize production deployment
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-${{ inputs.environment_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      - name: Validate Compose
        run: docker compose config --quiet

  plan:
    if: inputs.confirm == 'DEPLOY'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      plan_sha: ${{ steps.plan_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ inputs.aws_region }}
          TF_VAR_film_id: ${{ inputs.film_id }}
          TF_VAR_environment_id: ${{ inputs.environment_id }}
          TF_VAR_name_prefix: aifilm-prod
        run: terraform plan -input=false -out=tfplan
      - name: Hash plan
        id: plan_sha
        working-directory: terraform
        run: echo "sha=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment_id }}
          path: terraform/tfplan
          retention-days: 7

  apply:
    if: inputs.confirm == 'DEPLOY'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment_id }}
          path: terraform
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: Verify plan artifact
        working-directory: terraform
        run: test -s tfplan
      - name: Terraform apply approved plan
        working-directory: terraform
        run: terraform apply -input=false tfplan
