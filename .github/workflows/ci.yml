name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e .[dev]
      - name: Test backend
        working-directory: backend
        run: pytest -q

  ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine
        working-directory: ai-engine
        run: pip install -e .
      - name: Test engine
        working-directory: ai-engine
        run: pytest -q

  film-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        working-directory: film-runtime
        run: pip install -e .
      - name: Test runtime
        working-directory: film-runtime
        run: pytest -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        working-directory: workers
        run: pip install -e .
      - name: Compile worker
        working-directory: workers
        run: python -m compileall -q src

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  containers:
    runs-on: ubuntu-latest
    needs: [backend, ai-engine, film-runtime, worker, frontend, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - name: Build application containers
        run: docker compose build --pull
