name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      film_id:
        description: Film environment identifier
        required: true
        type: string
      environment_id:
        description: Runtime environment identifier
        required: true
        type: string
      aws_region:
        description: AWS region
        required: true
        default: ap-south-1
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging-${{ inputs.environment_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
      - name: Docker Compose validation
        run: docker compose config --quiet

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ inputs.aws_region }}
          TF_VAR_film_id: ${{ inputs.film_id }}
          TF_VAR_environment_id: ${{ inputs.environment_id }}
          TF_VAR_name_prefix: aifilm-staging
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ inputs.aws_region }}
          TF_VAR_film_id: ${{ inputs.film_id }}
          TF_VAR_environment_id: ${{ inputs.environment_id }}
          TF_VAR_name_prefix: aifilm-staging
        run: terraform apply -input=false tfplan
